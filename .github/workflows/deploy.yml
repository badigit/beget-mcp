name: Deploy beget-mcp

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Нативный ssh вместо appleboy/ssh-action: тому пришлось бы отдать
      # приватный ключ прод-хоста, то есть доверить root чужому коду,
      # обновляющемуся вне нашего контроля.
      - name: Prepare ssh key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # Ключ на хосте заперт в forced command (/usr/local/sbin/ci-deploy-beget-mcp,
      # ставится playbook'ом install-ci-deploy.yml в репо infra-docker). Отсюда уходит
      # только глагол; шаги деплоя (git pull, compose up --build, restart mcpproxy-go)
      # живут в обёртке на хосте. Прислать shell-строку бессмысленно: sshd её не
      # исполнит, обёртка запишет REJECT в journalctl -t ci-deploy.
      - name: Deploy to VPS
        run: |
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" deploy

      - name: Verify container is running
        run: |
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" verify
