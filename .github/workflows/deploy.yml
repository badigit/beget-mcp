name: Deploy beget-mcp

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/beget-mcp && git pull --ff-only
            # Стек mcp-gateway переехал из /opt/mcp-gateway в монорепо infra-docker
            # (27.04.2026). Со старым путём деплой молча не доезжал с апреля.
            cd /opt/infra-docker/beget-vps/mcp-gateway
            docker compose up -d --build beget-mcp
            docker compose restart mcpproxy-go
